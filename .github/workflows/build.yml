name: Build Bread Compact Wifi

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build bread-compact-wifi
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi --name bread-compact-wifi-128x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_bread-compact-wifi_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error